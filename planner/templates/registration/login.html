<!DOCTYPE html>
<html>
<head>
    <title>Login - Study Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 2rem;
            text-align: center;
        }
        .card-header h3 {
            margin: 0;
            font-weight: 700;
            font-size: 2rem;
        }
        .card-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-right: none;
            color: #667eea;
            border-radius: 10px 0 0 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e9ecef;
        }
        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .signup-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .welcome-message {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card login-card">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-book-open"></i> Study Planner</h3>
                            <p class="mb-0 mt-2">Welcome back! Please sign in to continue.</p>
                        </div>
                        <div class="card-body">
                            {% if user.is_authenticated %}
                                <div class="welcome-message alert mb-3">
                                    <i class="fa-solid fa-check-circle"></i>
                                    Welcome back, <strong>{{ user.username }}</strong>!
                                </div>
                                <a href="/" class="btn btn-primary mb-2">
                                    <i class="fa-solid fa-tachometer-alt"></i> Go to Dashboard
                                </a>
                                <a href="{% url 'logout' %}" class="btn btn-outline-secondary w-100">
                                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                                </a>
                            {% else %}
                                <form method="post" action="{% url 'login' %}">
                                    {% csrf_token %}
                                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">
                                            <i class="fa-solid fa-user"></i> Username
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="fa-solid fa-at"></i>
                                            </span>
                                            <input type="text" class="form-control" id="username" name="username" 
                                                   placeholder="Enter your username" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">
                                            <i class="fa-solid fa-lock"></i> Password
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="fa-solid fa-key"></i>
                                            </span>
                                            <input type="password" class="form-control" id="password" name="password" 
                                                   placeholder="Enter your password" required>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fa-solid fa-sign-in-alt"></i> Login
                                    </button>
                                </form>
                                {% if error %}
                                    <div class="alert alert-danger mt-3">
                                        <i class="fa-solid fa-exclamation-triangle"></i>
                                        {{ error }}
                                    </div>
                                {% endif %}
                                <div class="signup-link">
                                    Don't have an account? 
                                    <a href="{% url 'signup' %}">
                                        <i class="fa-solid fa-user-plus"></i> Sign up here
                                    </a>
                                </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
